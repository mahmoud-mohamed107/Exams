<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Grade 2 Math Exam</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Nunito:wght@500;700;800&family=Cairo:wght@500;700;800&display=swap">
<style>
/* Layout: one question per screen in a centered card; chunky tactile buttons; graphs drawn as bright dot-columns */
:root{
  --bg:#E6F4FF; --card:#FFFFFF; --ink:#1B2A4A; --soft:#5B6B8C; --line:#C9DCF0; --cell:#F5FAFF;
  --blue:#2F7BEA; --blue-d:#1F5CBA; --pink:#FF5C8A; --yellow:#FFC83D; --green:#22B573; --green-bg:#DDF6EA; --red:#F0475B; --red-bg:#FFE3E7; --purple:#8A5CF5;
  --c1:#FF5C8A; --c2:#2F7BEA; --c3:#FFB703; --c4:#22B573; --c5:#8A5CF5;
  --display:'Baloo 2','Trebuchet MS',system-ui,sans-serif; --body:'Nunito','Trebuchet MS',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101C3A; --card:#1B2B54; --ink:#F1F5FF; --soft:#A9B8DB; --line:#33477D; --cell:#162448;
  --blue:#5B9BFF; --blue-d:#3E7EE0; --green-bg:#12392D; --red-bg:#47202B; --green:#3BD18C; --red:#FF7587; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101C3A; --card:#1B2B54; --ink:#F1F5FF; --soft:#A9B8DB; --line:#33477D; --cell:#162448;
  --blue:#5B9BFF; --blue-d:#3E7EE0; --green-bg:#12392D; --red-bg:#47202B; --green:#3BD18C; --red:#FF7587; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-weight:600;font-size:18px;line-height:1.45;
  padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:780px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1,h2,h3{font-family:var(--display);margin:0;line-height:1.1;text-wrap:balance}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:4px solid var(--yellow);outline-offset:2px}

.btn{background:var(--blue);color:#fff;border:0;border-radius:18px;padding:12px 28px;font-family:var(--display);font-weight:800;font-size:1.3rem;
  box-shadow:0 5px 0 var(--blue-d);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--blue-d)}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:0 5px 0 var(--blue-d)}
.btn.go{background:var(--green);box-shadow:0 5px 0 #138a55}
.btn.go:active{box-shadow:0 1px 0 #138a55}

/* start + result */
.hero{background:var(--card);border-radius:28px;padding:28px 22px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px;box-shadow:0 6px 0 var(--line)}
.hero h1{font-size:clamp(2rem,7vw,3rem);color:var(--blue)}
.hero p{margin:0;color:var(--soft);max-width:34ch}
.demo{display:flex;gap:8px;align-items:flex-end;height:84px;padding:0 6px}
.demo i{width:30px;border-radius:12px 12px 6px 6px;display:block;animation:rise .7s ease-out both}
@keyframes rise{from{height:0}}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chip{background:var(--cell);border:2px solid var(--line);border-radius:999px;padding:3px 12px;font-size:.85rem}

/* top bar */
.top{display:flex;align-items:center;gap:12px}
.bar{flex:1;height:16px;background:var(--card);border-radius:99px;border:2px solid var(--line);overflow:hidden}
.bar b{display:block;height:100%;background:linear-gradient(90deg,var(--pink),var(--yellow),var(--green));border-radius:99px;transition:width .35s}
.pill{background:var(--card);border:2px solid var(--line);border-radius:99px;padding:2px 14px;font-family:var(--display);font-weight:800;white-space:nowrap}

/* question card */
.q{background:var(--card);border-radius:28px;padding:20px;box-shadow:0 6px 0 var(--line);display:flex;flex-direction:column;gap:16px;min-width:0}
.meta{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:.8rem;text-transform:uppercase;letter-spacing:.08em;color:var(--soft)}
.tag{background:var(--cell);border-radius:99px;padding:2px 12px;border:2px solid var(--line)}
.stars-lv{color:var(--yellow);letter-spacing:2px}
.prompt{font-size:1.25rem;font-weight:800;margin:0}
.visual{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;min-width:0}

.graph{margin:0;flex:1 1 280px;max-width:100%;min-width:0;background:var(--cell);border:2px solid var(--line);border-radius:18px;padding:10px 8px 6px}
.graph figcaption{font-family:var(--display);font-weight:800;text-align:center;line-height:1.15}
.graph figcaption small{display:block;font-family:var(--body);font-weight:700;color:var(--soft);font-size:.8rem}
.graph svg{display:block;width:100%;height:auto;margin:auto}
.graph text{fill:var(--ink);font-family:var(--body);font-weight:800}
.gcell{fill:var(--card);stroke:var(--line)}

.scatter{display:flex;flex-wrap:wrap;gap:6px 10px;justify-content:center;background:var(--cell);border:2px dashed var(--line);border-radius:18px;padding:12px;font-size:2rem;line-height:1.1;width:100%}
.scatter span{display:inline-block}

table.chart{border-collapse:separate;border-spacing:0;width:100%;max-width:560px;margin:auto;border:2px solid var(--line);border-radius:14px;overflow:hidden;text-align:center;background:var(--cell)}
table.chart caption{font-family:var(--display);font-weight:800;padding:4px}
table.chart th,table.chart td{padding:8px 4px;border-top:2px solid var(--line);border-left:2px solid var(--line)}
table.chart tr>*:first-child{border-left:0;background:var(--card)}
table.chart thead th{background:var(--card);border-top:0}
.tbl-wrap{overflow-x:auto;width:100%}

.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.opt{display:flex;align-items:center;gap:10px;text-align:left;background:var(--card);border:3px solid var(--line);border-radius:16px;padding:10px 14px;font-weight:800;box-shadow:0 4px 0 var(--line);min-height:56px}
.opt .k{flex:none;width:32px;height:32px;border-radius:50%;background:var(--cell);border:2px solid var(--line);display:grid;place-items:center;font-family:var(--display);font-size:.95rem}
.opt[aria-pressed="true"]{border-color:var(--blue);background:var(--cell)}
.opt[aria-pressed="true"] .k{background:var(--blue);border-color:var(--blue);color:#fff}
.opt.right{border-color:var(--green);background:var(--green-bg)}
.opt.right .k{background:var(--green);border-color:var(--green);color:#fff}
.opt.wrong{border-color:var(--red);background:var(--red-bg)}
.opt.wrong .k{background:var(--red);border-color:var(--red);color:#fff}
.opt:disabled{cursor:default}
.tf{grid-template-columns:1fr 1fr}

.num{font-family:var(--display);font-weight:800;font-size:1.6rem;width:5.2rem;text-align:center;border:3px solid var(--line);border-radius:14px;padding:6px;background:var(--card);color:var(--ink)}
.num:focus{border-color:var(--blue)}
.num.right{border-color:var(--green);background:var(--green-bg)}
.num.wrong{border-color:var(--red);background:var(--red-bg)}
.fillrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.unit{color:var(--soft);font-weight:800}

.fb{border-radius:18px;padding:12px 16px;display:flex;flex-direction:column;gap:2px}
.fb.ok{background:var(--green-bg);border:2px solid var(--green)}
.fb.no{background:var(--red-bg);border:2px solid var(--red)}
.fb h3{font-size:1.35rem}
.fb.ok h3{color:var(--green)} .fb.no h3{color:var(--red)}
.fb p{margin:0;font-size:.95rem}
.act{display:flex;justify-content:flex-end}

/* results */
.score{font-family:var(--display);font-weight:800;font-size:clamp(3rem,14vw,5rem);line-height:1;color:var(--blue)}
.stars{font-size:3rem;letter-spacing:6px;color:var(--yellow);line-height:1}
.stars .off{color:var(--line)}
.panel{background:var(--card);border-radius:28px;padding:20px;box-shadow:0 6px 0 var(--line);display:flex;flex-direction:column;gap:12px}
.topic{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;align-items:center}
.topic .tb{grid-column:1/-1;height:14px;background:var(--cell);border-radius:99px;border:2px solid var(--line);overflow:hidden}
.topic .tb b{display:block;height:100%;border-radius:99px}
.rev{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 12px;padding:10px 0;border-top:2px solid var(--line);font-size:.95rem}
.rev .n{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff;font-family:var(--display);font-weight:800}
.rev .n.ok{background:var(--green)} .rev .n.no{background:var(--red)}
.rev p{margin:0}
.rev .ans{color:var(--soft);font-size:.85rem}
.rev .ans b{color:var(--ink)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* vertical sums + chapter picker + parent report */
table.vert{border-collapse:collapse;margin:auto;font-family:var(--display);font-weight:800;font-size:1.9rem;text-align:center;background:var(--cell);border:2px solid var(--line);border-radius:14px;overflow:hidden}
table.vert th{font-family:var(--body);font-size:.8rem;color:var(--soft);padding:4px 14px;background:var(--card)}
table.vert td{width:3.2rem;height:2.6rem;padding:0 8px}
table.vert td:first-child{width:2rem;color:var(--blue)}
table.vert tr.last td{border-bottom:4px solid var(--ink)}
.chs{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;color:var(--soft);font-size:.9rem}
.mini{background:var(--cell);border:2px solid var(--line);border-radius:12px;padding:4px 14px;font-weight:800;box-shadow:0 3px 0 var(--line)}
.mini:active{transform:translateY(2px);box-shadow:0 1px 0 var(--line)}
.chips.left{justify-content:flex-start}
.soft{color:var(--soft);margin:0}
.parent h4{font-family:var(--display);font-size:1.15rem;margin:6px 0 0}
.parent h4.good{color:var(--green)} .parent h4.warn{color:var(--red)}
.parent .big{margin:0;font-size:1.2rem}
.plist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.plist li{display:flex;justify-content:space-between;gap:10px;background:var(--green-bg);border:2px solid var(--green);border-radius:12px;padding:6px 12px}
.adv{background:var(--red-bg);border:2px solid var(--red);border-radius:14px;padding:10px 14px;display:flex;flex-direction:column;gap:4px}
.adv h4{display:flex;justify-content:space-between;gap:10px;color:var(--ink);margin:0}
.adv p{margin:0;font-size:.95rem}
.parent h4.watch{color:var(--soft)} .adv.mild{background:var(--cell);border-color:var(--line)} .note{font-size:.85rem}

.langs{display:flex;flex-wrap:wrap;gap:10px}
.lang{flex:1 1 220px;background:var(--cell);border:3px solid var(--line);border-radius:16px;padding:10px 14px;font-weight:800;font-size:1.05rem;box-shadow:0 4px 0 var(--line)}
.lang[aria-pressed="true"]{background:var(--blue);border-color:var(--blue-d);color:#fff;box-shadow:0 4px 0 var(--blue-d)}
.lang:first-child{font-family:'Cairo',var(--body)}
.rep[hidden]{display:none!important}
.rep{display:flex;flex-direction:column;gap:10px}
.rep h3{font-size:1.4rem}
.ar,.ar h3,.ar h4,.ar .chip{font-family:'Cairo',var(--body)}
.ar{line-height:1.7}
</style>

<div class="wrap" id="app"></div>

<script>
/* ---------- DATA ---------- */
var PETS=[{n:'Dog',e:'🐶',v:7},{n:'Cat',e:'🐱',v:9},{n:'Rabbit',e:'🐰',v:4},{n:'Fish',e:'🐟',v:7},{n:'Bird',e:'🐦',v:3}];
var TRAVEL=[{n:'Train',e:'🚆',v:8},{n:'Bus',e:'🚌',v:5},{n:'Ship',e:'🚢',v:3},{n:'Plane',e:'✈️',v:6}];
var FRUIT1=[{n:'Bananas',e:'🍌',v:7},{n:'Apples',e:'🍎',v:3},{n:'Oranges',e:'🍊',v:6},{n:'Strawberries',e:'🍓',v:9},{n:'Grapes',e:'🍇',v:5}];
var FRUIT2=[{n:'Bananas',e:'🍌',v:5},{n:'Apples',e:'🍎',v:8},{n:'Oranges',e:'🍊',v:6},{n:'Strawberries',e:'🍓',v:6},{n:'Grapes',e:'🍇',v:7}];
var SPORT1=[{n:'Football',e:'⚽',v:8},{n:'Basketball',e:'🏀',v:4},{n:'Handball',e:'🤾',v:6},{n:'Volleyball',e:'🏐',v:9},{n:'Tennis',e:'🎾',v:2}];
var SPORT2=[{n:'Football',e:'⚽',v:5},{n:'Basketball',e:'🏀',v:7},{n:'Handball',e:'🤾',v:6},{n:'Volleyball',e:'🏐',v:4},{n:'Tennis',e:'🎾',v:8}];
var TOYS=[{n:'Kite',e:'🪁',v:5},{n:'Ball',e:'⚽',v:4},{n:'Car',e:'🚗',v:3},{n:'Teddy',e:'🧸',v:6}];
var FRUITPIC=[{n:'Apples',e:'🍎',v:5},{n:'Bananas',e:'🍌',v:3},{n:'Oranges',e:'🍊',v:6},{n:'Grapes',e:'🍇',v:4}];

var COLORS=['var(--c1)','var(--c2)','var(--c3)','var(--c4)','var(--c5)'];
var T_MAKE='Making graphs',T_RG='Reading graphs',T_RC='Reading charts',T_OP='Add and subtract words',T_CMP='Comparing graphs';
var T_READ='Reading graphs and charts';
var T_ADD1='Adding 2-digit numbers',T_ADD2='Adding with regrouping',T_COMM='Swapping addends';
var T_SUB1='Subtracting 2-digit numbers',T_SUB2='Subtracting with regrouping',T_REL='Checking with addition';
var TOPICS=[
 {n:T_MAKE,ch:1,tip:'Practice making a graph: put one circle on the graph for each picture, then count each column. Check that the number of circles matches the number of pictures.'},
 {n:T_READ,ch:1,tip:'The tallest column is the most and the shortest is the least. A chart shows exact numbers: add for "in all" and subtract for "how many more". Ask your child to read a graph aloud and answer 3 questions about it.'},
 {n:T_CMP,ch:1,tip:'Look at both graphs one item at a time. Write down both numbers, then add to find the total or subtract to find the difference.'},
 {n:T_ADD1,ch:2,tip:'Write Ones under Ones and Tens under Tens. Add the Ones first, then the Tens. When adding a 1-digit number, put it in the Ones place.'},
 {n:T_ADD2,ch:2,tip:'When the Ones add up to 10 or more, keep the ones and carry 1 ten to the Tens place. Use tens sticks and ones blocks to show it.'},
 {n:T_COMM,ch:2,tip:'Swapping the numbers in an addition gives the same answer, like 7 + 3 and 3 + 7. Try it with real objects such as pencils.'},
 {n:T_SUB1,ch:3,tip:'Write the bigger number on top. Subtract the Ones first, then the Tens. A 1-digit number goes in the Ones place.'},
 {n:T_SUB2,ch:3,tip:'If the top Ones digit is smaller, take 1 ten and change it into 10 ones. Add them to the Ones, then subtract. Practice with ten-sticks.'},
 {n:T_REL,ch:3,tip:'Check a subtraction by adding. The answer plus the number taken away must equal the number you started with.'}
];
var TOPIC_CH={};TOPICS.forEach(function(t){TOPIC_CH[t.n]=t.ch});

/* ---------- HELPERS ---------- */
function get(d,n){return d.filter(function(x){return x.n===n})[0]}
function val(d,n){return get(d,n).v}
function maxOf(d){return d.reduce(function(a,b){return b.v>a.v?b:a})}
function minOf(d){return d.reduce(function(a,b){return b.v<a.v?b:a})}
function names(d){return d.map(function(x){return x.n})}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;')}
function seeded(seed){return function(){seed=(seed*9301+49297)%233280;return seed/233280}}
function shuffle(a,rnd){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(rnd()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}

function graph(title,sub,d,opts){
  opts=opts||{};var rows=9,cw=64,ch=34,pad=6,lab=62;
  var W=pad*2+d.length*cw,H=pad+rows*ch+lab,s='';
  d.forEach(function(c,i){
    var x=pad+i*cw,n=c.shown!=null?c.shown:c.v;
    for(var r=0;r<rows;r++){s+='<rect class="gcell" x="'+x+'" y="'+(pad+r*ch)+'" width="'+cw+'" height="'+ch+'"/>'}
    for(var k=0;k<n;k++){s+='<circle cx="'+(x+cw/2)+'" cy="'+(pad+(rows-1-k)*ch+ch/2)+'" r="13" fill="'+COLORS[i%5]+'"/>'}
    s+='<text x="'+(x+cw/2)+'" y="'+(pad+rows*ch+26)+'" font-size="22" text-anchor="middle">'+c.e+'</text>';
    s+='<text x="'+(x+cw/2)+'" y="'+(pad+rows*ch+48)+'" font-size="'+(c.n.length>9?10.5:12)+'" text-anchor="middle">'+esc(c.n)+'</text>';
  });
  return '<figure class="graph" style="max-width:'+(W+24)+'px"><figcaption>'+esc(title)+(sub?'<small>'+esc(sub)+'</small>':'')+'</figcaption>'+
    '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+esc(title+' '+(sub||'')+': '+d.map(function(c){return c.n+' '+(c.shown!=null?c.shown:c.v)}).join(', '))+'">'+s+'</svg></figure>';
}
function chartTable(title,d,blank,labelA,labelB){
  var h='<div class="tbl-wrap"><table class="chart"><caption>'+esc(title)+'</caption><thead><tr><th>'+labelA+'</th>'+d.map(function(c){return '<th>'+c.e+'<br>'+esc(c.n)+'</th>'}).join('')+'</tr></thead><tbody><tr><th>'+labelB+'</th>'+
   d.map(function(c,i){return '<td>'+(blank?'<input class="num fillin" id="f'+i+'" inputmode="numeric" maxlength="2" aria-label="Number of '+esc(c.n)+'">':c.v)+'</td>'}).join('')+'</tr></tbody></table></div>';
  return h;
}
function scatter(d,seed){
  var rnd=seeded(seed),all=[];
  d.forEach(function(c){for(var i=0;i<c.v;i++)all.push(c.e)});
  all=shuffle(all,rnd);
  return '<div class="scatter" aria-label="A mix of pictures">'+all.map(function(e){return '<span style="transform:rotate('+Math.round(rnd()*40-20)+'deg) translateY('+Math.round(rnd()*10-5)+'px)">'+e+'</span>'}).join('')+'</div>';
}
function vert(a,b,op){
  function dg(n){var t=Math.floor(n/10),o=n%10;return [t?t:'',o]}
  var A=dg(a),B=dg(b);
  return '<table class="vert" aria-label="'+a+' '+(op==='+'?'plus':'minus')+' '+b+'"><thead><tr><th></th><th>Tens</th><th>Ones</th></tr></thead><tbody><tr><td></td><td>'+A[0]+'</td><td>'+A[1]+'</td></tr><tr class="last"><td>'+op+'</td><td>'+B[0]+'</td><td>'+B[1]+'</td></tr></tbody></table>';
}
function diffTxt(a,b){return a.map(function(c,i){return c.n+': '+Math.max(c.v,b[i].v)+' − '+Math.min(c.v,b[i].v)+' = '+Math.abs(c.v-b[i].v)}).join(', ')}

/* ---------- QUESTIONS ---------- */
function build(){
  var q=[];
  var petV=function(){return graph('Favorite Pet','Number of students',PETS)};
  var travV=function(){return chartTable('Favorite Means of Travel',TRAVEL,false,'Means of travel','Number of people')};
  var f1=function(){return graph('Favorite Fruit','Class 1',FRUIT1)}, f2=function(){return graph('Favorite Fruit','Class 2',FRUIT2)};
  var cmpF=function(){return f1()+f2()};
  var s1=function(){return graph('Favorite Sport','Group 1',SPORT1)}, s2=function(){return graph('Favorite Sport','Group 2',SPORT2)};
  var cmpS=function(){return s1()+s2()};
  var teddy=get(TOYS,'Teddy');
  var wrongFruit=FRUITPIC.map(function(c){return {n:c.n,e:c.e,v:c.v,shown:c.n==='Bananas'?c.v+1:c.v}});

  q.push({t:T_MAKE,lv:1,type:'fill',p:'Look at the pictures. How many '+teddy.e+' teddy bears are there?',
    vis:function(){return scatter(TOYS,7)},ans:[teddy.v],unit:'teddy bears',why:'Count each teddy bear one time. There are '+teddy.v+'.'});

  q.push({t:T_MAKE,lv:2,type:'mc',p:'Sam put one circle for each picture. One column has a mistake. Which column is wrong?',
    vis:function(){return scatter(FRUITPIC,21)+graph('Number of Fruits','Sam\'s graph',wrongFruit)},
    opts:names(FRUITPIC),ans:'Bananas',why:'There are 3 bananas in the pictures, but the graph shows 4 circles.'});

  q.push({t:T_MAKE,lv:2,type:'chart',p:'Count the circles in each column. Write the numbers in the chart.',
    vis:function(){return petV()+chartTable('Favorite Pet',PETS,true,'Pet','Number')},ans:PETS.map(function(c){return c.v}),
    ansTxt:PETS.map(function(c){return c.n+' '+c.v}).join(', '),why:'A chart shows the exact number. Count the circles in each column.'});

  var mx=maxOf(PETS),mn=minOf(PETS);
  q.push({t:T_RG,lv:1,type:'mc',p:'Look at the graph. Which pet is the most favorite?',vis:petV,opts:names(PETS),ans:mx.n,
    why:'The longest column has the greatest number. '+mx.n+' has '+mx.v+' circles.'});
  q.push({t:T_RG,lv:1,type:'mc',p:'Which pet is the least favorite?',vis:petV,opts:names(PETS),ans:mn.n,

var app=document.getElementById('app'),Q=[],i=0,res=[],sel=null,checked=false,lastCh=0;
var LETTERS='ABCDE';

function start(ch){

}
function home(){

   '<button class="btn go" id="start">Start the exam</button>'+
   '</section>';
  document.getElementById('start').onclick=function(){start(0)};

function showQ(){
  var q=Q[i],pct=Math.round(i/Q.length*100),right=res.filter(function(r){return r.ok}).length;
  var body='';
  if(q.type==='mc'){
    body='<div class="opts">'+q.opts.map(function(o,k){return '<button class="opt" data-v="'+esc(o)+'" aria-pressed="false"><span class="k">'+LETTERS[k]+'</span><span>'+esc(o)+'</span></button>'}).join('')+'</div>';
  }else if(q.type==='tf'){
    body='<div class="opts tf"><button class="opt" data-v="true" aria-pressed="false"><span class="k">✓</span><span>True</span></button><button class="opt" data-v="false" aria-pressed="false"><span class="k">✗</span><span>False</span></button></div>';
  }else if(q.type==='fill'){
    body='<div class="fillrow"><span class="unit">Answer:</span><input class="num fillin" id="f0" inputmode="numeric" maxlength="2" aria-label="Your answer"><span class="unit">'+esc(q.unit||'')+'</span></div>';
  }
  app.innerHTML='<div class="top"><div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="'+Q.length+'" aria-valuenow="'+i+'"><b style="width:'+pct+'%"></b></div><div class="pill">★ '+right+'</div></div>'+
   '<section class="q"><div class="meta"><span>Question '+(i+1)+' of '+Q.length+' · <span class="tag">'+q.t+'</span></span><span class="stars-lv" title="Difficulty" aria-label="Level '+q.lv+' of 3">'+'★'.repeat(q.lv)+'<span style="color:var(--line)">'+'★'.repeat(3-q.lv)+'</span></span></div>'+
   '<p class="prompt">'+esc(q.p)+'</p>'+(q.vis?'<div class="visual">'+q.vis()+'</div>':'')+
   (q.type==='chart'?'':body)+'<div id="fb" aria-live="polite"></div><div class="act"><button class="btn" id="go" disabled>Check</button></div></section>';
  sel=null;checked=false;
  var go=document.getElementById('go');
  go.onclick=function(){checked?next():check()};
  Array.prototype.forEach.call(app.querySelectorAll('.opt'),function(b){b.onclick=function(){
    if(checked)return;sel=b.getAttribute('data-v');
    Array.prototype.forEach.call(app.querySelectorAll('.opt'),function(x){x.setAttribute('aria-pressed',x===b?'true':'false')});go.disabled=false}});
  var ins=app.querySelectorAll('.fillin');
  Array.prototype.forEach.call(ins,function(inp,k){
    inp.oninput=function(){inp.value=inp.value.replace(/\D/g,'');go.disabled=!Array.prototype.every.call(ins,function(x){return x.value!==''})};
    inp.onkeydown=function(e){if(e.key==='Enter'){e.preventDefault();if(!go.disabled)go.click()}else if(e.key!=='Backspace'&&inp.value.length>=2&&q.type!=='chart'){}};
  });
  if(q.type==='fill'&&ins[0])ins[0].focus({preventScroll:true});
}

function fmt(q){
  if(q.type==='tf')return q.ans?'True':'False';
  if(q.type==='fill')return q.ans[0]+(q.unit?' '+q.unit:'');
  if(q.type==='chart')return q.ansTxt;
  return q.ans;
}
function check(){
  var q=Q[i],ok=false,given='';
  if(q.type==='mc'){ok=sel===q.ans;given=sel;
    Array.prototype.forEach.call(app.querySelectorAll('.opt'),function(b){var v=b.getAttribute('data-v');b.disabled=true;
      if(v===q.ans)b.classList.add('right');else if(v===sel)b.classList.add('wrong')})}
  else if(q.type==='tf'){var pick=sel==='true';ok=pick===q.ans;given=pick?'True':'False';
    Array.prototype.forEach.call(app.querySelectorAll('.opt'),function(b){var v=b.getAttribute('data-v')==='true';b.disabled=true;
      if(v===q.ans)b.classList.add('right');else if(b.getAttribute('data-v')===sel)b.classList.add('wrong')})}
  else{
    var ins=app.querySelectorAll('.fillin');ok=true;var g=[];
    Array.prototype.forEach.call(ins,function(inp,k){var v=parseInt(inp.value,10);g.push(v);inp.disabled=true;
      if(v===q.ans[k])inp.classList.add('right');else{ok=false;inp.classList.add('wrong')}});
    given=q.type==='chart'?q.vis&&PETS.map(function(c,k){return c.n+' '+g[k]}).join(', '):String(g[0]);
  }
  checked=true;res.push({ok:ok,given:given,q:q});
  var good=['Great job!','Super!','You got it!','Awesome!','Well done!'][i%5];
  document.getElementById('fb').innerHTML=ok?
    '<div class="fb ok"><h3>'+good+'</h3><p>'+esc(q.why)+'</p></div>':
    '<div class="fb no"><h3>Not quite.</h3><p>Correct answer: <b>'+esc(fmt(q))+'</b></p><p>'+esc(q.why)+'</p></div>';
  var go=document.getElementById('go');go.disabled=false;go.className='btn go';go.textContent=i===Q.length-1?'See my results':'Next';
  go.focus({preventScroll:true});
  document.getElementById('fb').scrollIntoView({block:'nearest',behavior:'smooth'});
}
function next(){
  if(i<Q.length-1){i++;showQ();window.scrollTo(0,0)}else summary();
}

     good:'نقاط القوة',noGood:'مفيش مهارة كانت كلها صح المرة دي. كل المهارات اللي تحت هتتحسن بشوية تدريب.',

  function rep(g){
    var l=L[g],sc2=function(x){return '<span dir="ltr">'+x.a+' / '+x.b+'</span>'};

    var card=function(t,mild){var x=by[t.n];return '<div class="adv'+(mild?' mild':'')+'"><h4>'+esc(l.name(t))+' '+sc2(x)+'</h4><p class="soft">'+l.ch+t.ch+' · '+(x.miss.length>1?l.missMany:l.missOne)+x.miss.join(l.sep)+'</p><p>'+esc(l.tip(t))+'</p></div>'};
    return '<div id="rep-'+g+'" dir="'+l.dir+'" lang="'+l.lang+'" class="rep'+(g==='ar'?' ar':'')+'"'+(g==='ar'?'':' hidden')+'>'+

      '<p class="soft note">'+l.note+'</p></div>';
  }
